name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # OpenTUI ships its renderer as a platform-specific native module, so each
      # binary is compiled on its own architecture rather than cross-compiled.
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: darwin-x64
            runner: macos-13
          - name: darwin-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Compile
        run: bun run scripts/build.ts --outfile "dist/lazygortex-${{ matrix.name }}"

      - name: Smoke the binary
        run: ./dist/lazygortex-${{ matrix.name }} --version

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 "lazygortex-${{ matrix.name }}" > "lazygortex-${{ matrix.name }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/lazygortex-${{ matrix.name }}
            dist/lazygortex-${{ matrix.name }}.sha256

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        working-directory: artifacts
        run: |
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -la

      - uses: softprops/action-gh-release@v3
        with:
          # a dispatch run has no tag ref of its own; without this the release
          # would be named after the branch
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:bundle

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

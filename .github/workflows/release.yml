name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # OpenTUI ships its renderer as a platform-specific native module, so each
      # binary is compiled on its own architecture rather than cross-compiled.
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          # macos-13 was retired: an unknown label queues for a runner that will
          # never arrive rather than failing, and macos-14 is deprecated behind it
          - name: darwin-x64
            runner: macos-15-intel
          - name: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Nothing downstream reconciles these: the GitHub release is named from
      # the tag, npm publishes what package.json says, and the two jobs run in
      # parallel. A mismatch would publish a release named v0.2.0 carrying
      # binaries that print 0.1.0, and the release cannot be un-published by
      # re-running the workflow. Fail here, before anything is built.
      - name: Tag matches package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="v$(bun --print 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json $version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Compile
        run: bun run scripts/build.ts --outfile "dist/lazygortex-${{ matrix.name }}"

      # --check-renderer is the half that touches the native module; --version
      # returns 0 even when the renderer cannot be loaded at all
      - name: Smoke the binary
        run: |
          ./dist/lazygortex-${{ matrix.name }} --version
          ./dist/lazygortex-${{ matrix.name }} --check-renderer

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 "lazygortex-${{ matrix.name }}" > "lazygortex-${{ matrix.name }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/lazygortex-${{ matrix.name }}
            dist/lazygortex-${{ matrix.name }}.sha256

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        working-directory: artifacts
        run: |
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -la

      - uses: softprops/action-gh-release@v3
        with:
          # a dispatch run has no tag ref of its own; without this the release
          # would be named after the branch
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm:
    # after the release, not beside it: a failed publish should not leave a
    # release standing on its own
    needs: [binaries, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:bundle

      # the secrets context cannot be read from a job- or step-level `if`, so
      # the presence of the token becomes an output that can be
      - id: token
        name: Is a publish token configured?
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not set — skipping the npm publish. The release and its binaries are unaffected; add the secret and re-run this job to publish."
          fi

      # provenance is asked for here rather than in publishConfig, which would
      # demand it of every publish including one from a laptop, where there is
      # no provider to attest and npm refuses with `provider: null`.
      # It attests what the runner built from *this* ref: on a dispatch run that
      # is a branch, not the tag the release is named after, so the attestation
      # would say something true about the wrong thing
      - name: Publish
        if: steps.token.outputs.present == 'true'
        run: npm publish ${{ github.event_name == 'push' && '--provenance' || '' }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # OpenTUI ships its renderer as a platform-specific native module, so each
      # binary is compiled on its own architecture rather than cross-compiled.
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          # macos-13 was retired: an unknown label queues for a runner that will
          # never arrive rather than failing, and macos-14 is deprecated behind it
          - name: darwin-x64
            runner: macos-15-intel
          - name: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Nothing downstream reconciles these: the GitHub release is named from
      # the tag, npm publishes what package.json says, and the two jobs run in
      # parallel. A mismatch would publish a release named v0.2.0 carrying
      # binaries that print 0.1.0, and the release cannot be un-published by
      # re-running the workflow. Fail here, before anything is built.
      - name: Tag matches package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="v$(bun --print 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json $version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Compile
        run: bun run scripts/build.ts --outfile "dist/lazygortex-${{ matrix.name }}"

      # --check-renderer is the half that touches the native module; --version
      # returns 0 even when the renderer cannot be loaded at all
      - name: Smoke the binary
        run: |
          ./dist/lazygortex-${{ matrix.name }} --version
          ./dist/lazygortex-${{ matrix.name }} --check-renderer

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 "lazygortex-${{ matrix.name }}" > "lazygortex-${{ matrix.name }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/lazygortex-${{ matrix.name }}
            dist/lazygortex-${{ matrix.name }}.sha256

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        working-directory: artifacts
        run: |
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -la

      - uses: softprops/action-gh-release@v3
        with:
          # a dispatch run has no tag ref of its own; without this the release
          # would be named after the branch
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm:
    # after the release, not beside it: a failed publish should not leave a
    # release standing on its own
    needs: [binaries, release]
    # tag pushes only. Trusted publishing attests whatever ref its OIDC token
    # names, so a dispatch run from a branch would publish an attestation that
    # describes the branch rather than the tag the release is named after
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm 11.5.1 or later; Node 22 still ships 10.x
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:bundle

      # No token: the registry trusts this workflow, in this repository, through
      # the OIDC identity `id-token: write` grants it, and attests the publish
      # by itself. `--provenance` is not passed — asking for it explicitly is
      # what a token-authenticated publish needs, and publishConfig demanding it
      # is what made a publish by hand impossible.
      - name: Publish
        run: npm publish --access public

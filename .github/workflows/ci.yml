name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Format
        run: bun run format:check

      - name: Lint docs
        run: bun run lint:md

      # solid-js is inlined into the published bundle, so an unmet peer is a
      # statement that what we ship was built against a version we do not ship
      - name: Peer dependencies
        run: bun run check:peers

      # The frame tests need a gortex daemon and skip themselves without one,
      # so what runs here is the parser and colour units.
      - name: Test
        run: bun test

      - name: Build the npm bundle
        run: bun run build:bundle

      # the notices are generated from what the bundle actually inlines, so a
      # dependency that starts or stops being bundled has to be committed with it
      - name: Third-party notices are current
        run: git diff --exit-code THIRD-PARTY-NOTICES.txt

      # --version exits before the renderer is ever constructed, and opentui
      # defers a failed native-module import to the first render, so a broken
      # platform package used to pass every gate green
      - name: Smoke the bundle
        run: |
          bun dist/cli.js --version
          bun dist/cli.js --check-renderer

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run build:bundle

      # Prove a stranger can install the tarball and run the binary it exposes.
      - name: Pack and install into a scratch project
        run: |
          bun pm pack --destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          echo '{"name":"consumer","private":true}' > package.json
          bun add /tmp/lazygortex-*.tgz
          ./node_modules/.bin/lazygortex --version
          ./node_modules/.bin/lazygortex --check-renderer
